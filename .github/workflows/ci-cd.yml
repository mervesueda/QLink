# .github/workflows/ci-cd.yml – QLink Tam CI/CD Pipeline
#
# Aşamalar (şartname):
#   1. Lint       → ruff (Python) + eslint (JS)
#   2. Pytest     → unit + integration testler (Testcontainers)
#   3. Coverage   → %70 gate
#   4. Docker Build → multi-stage image'ları oluştur
#   5. Deploy     → docker-compose ile smoke ortamı ayağa kaldır
#   6. Smoke Test → /health endpoint + Newman (Postman)
#   7. E2E        → Playwright UI testleri
#
# Tetikleyiciler: main/develop branch push, PR

name: QLink CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:

  # ════════════════════════════════════════════════════════════
  # Aşama 1: Lint
  # ════════════════════════════════════════════════════════════
  lint:
    name: "1 – Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint (Python)
        run: ruff check backend/app backend/tests

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: ESLint (JS)
        run: npm run lint
        working-directory: frontend
        continue-on-error: true

  # ════════════════════════════════════════════════════════════
  # Aşama 2 + 3: Pytest + Coverage
  # ════════════════════════════════════════════════════════════
  test:
    name: "2+3 – Pytest & Coverage"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt
        working-directory: backend

      - name: Run all tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v
        working-directory: backend
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ════════════════════════════════════════════════════════════
  # Aşama 4: Docker Build
  # ════════════════════════════════════════════════════════════
  docker-build:
    name: "4 – Docker Build"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: qlink-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: qlink-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════
  # Aşama 5 + 6: Deploy (docker-compose) + Smoke Test + Newman
  # ════════════════════════════════════════════════════════════
  smoke-test:
    name: "5+6 – Deploy & Smoke Test"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d --build
        timeout-minutes: 5

      - name: Wait for backend health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/health; then
              echo "Backend hazır!"
              break
            fi
            echo "Bekleniyor... ($i/40)"
            sleep 3
          done

      - name: Smoke test – /health endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:8000/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"healthy"'

      - name: Smoke test – /api/v1/qr/generate (guest)
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/api/v1/qr/generate \
            -H "Content-Type: application/json" \
            -d '{"content":"https://github.com","qr_type":"url"}')
          echo "QR Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'file_url' in d"
          echo "✅ QR generate endpoint çalışıyor"

      - name: Smoke test – /metrics (Prometheus)
        run: |
          curl -sf http://localhost:8000/metrics | grep -q "http_requests_total"
          echo "✅ Prometheus metrics endpoint çalışıyor"

      - name: Node setup (Newman)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection (Newman)
        run: |
          newman run postman/QLink.postman_collection.json \
            --env-var BASE_URL=http://localhost:8000 \
            --reporters cli,json,htmlextra \
            --reporter-json-export newman-results.json \
            --reporter-htmlextra-export newman-report.html \
            --bail
        continue-on-error: false

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: |
            newman-results.json
            newman-report.html

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ════════════════════════════════════════════════════════════
  # Aşama 7: E2E Testleri (Playwright)
  # ════════════════════════════════════════════════════════════
  e2e:
    name: "7 – E2E (Playwright)"
    runs-on: ubuntu-latest
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps & Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start full stack
        run: docker compose up -d --build
        timeout-minutes: 5

      - name: Wait for frontend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000; then
              echo "Frontend hazır!"
              break
            fi
            echo "Frontend bekleniyor... ($i/30)"
            sleep 3
          done

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=html
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Stop services
        if: always()
        run: docker compose down -v
