# .github/workflows/ci.yml – QLink CI/CD Pipeline
#
# Aşamalar (şartname):
#   1. Lint       → ruff (Python) + eslint (JS)
#   2. Pytest     → unit + integration testler
#   3. Coverage   → %70 gate
#   4. Docker Build → multi-stage image'ları oluştur
#   5. Deploy     → docker-compose ile smoke ortamı ayağa kaldır
#   6. Smoke Test → /health endpoint + Newman (Postman)
#
# Tetikleyiciler: main/develop branch push, PR

name: QLink CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:

  # ════════════════════════════════════════════════════════════
  # Aşama 1: Lint
  # ════════════════════════════════════════════════════════════
  lint:
    name: "1 – Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint (Python)
        run: ruff check backend/app backend/tests
        # --exit-zero → uyarıları fail'e dönüştürme, sadece hataları yakala

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: ESLint (JS)
        run: npm run lint
        working-directory: frontend
        continue-on-error: true  # İlk sürümde uyarıları block etme

  # ════════════════════════════════════════════════════════════
  # Aşama 2 + 3: Pytest + Coverage
  # ════════════════════════════════════════════════════════════
  test:
    name: "2+3 – Pytest & Coverage"
    runs-on: ubuntu-latest
    needs: lint
    services:
      # Integration testler için PostgreSQL (Testcontainers alternatif olarak bu da kullanılabilir)
      # Testcontainers Docker socket üzerinden kendi container'ını başlatır
      docker:
        image: docker:24-dind
        options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-test.txt
        working-directory: backend

      - name: Run all tests with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v
        working-directory: backend
        env:
          # LocalStack mock için gerekli; gerçek AWS kullanılmaz
          AWS_DEFAULT_REGION: us-east-1

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  # ════════════════════════════════════════════════════════════
  # Aşama 4: Docker Build
  # ════════════════════════════════════════════════════════════
  docker-build:
    name: "4 – Docker Build"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: qlink-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: qlink-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════
  # Aşama 5 + 6: Deploy (docker-compose) + Smoke Test
  # ════════════════════════════════════════════════════════════
  smoke-test:
    name: "5+6 – Deploy & Smoke Test"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d --build --wait
        timeout-minutes: 5

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Backend hazır!"
              break
            fi
            echo "Bekleniyor... ($i/30)"
            sleep 2
          done

      - name: Smoke test – /health endpoint
        run: |
          RESPONSE=$(curl -s http://localhost:8000/health)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"healthy"'

      - name: Node setup (Newman)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection (Newman)
        run: |
          newman run postman/QLink.postman_collection.json \
            --env-var BASE_URL=http://localhost:8000 \
            --reporters cli,json \
            --reporter-json-export newman-results.json
        continue-on-error: false

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results.json

      - name: Stop services
        if: always()
        run: docker compose down -v
